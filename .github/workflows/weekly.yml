name: Mise à jour hebdomadaire du classement

on:
  schedule:
    # Tous les lundis à 03:00 UTC (04:00/05:00 à Paris), après les compétitions du week-end.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      all_seasons:
        description: "Reconstruire toutes les saisons (long, ~1h) au lieu de la saison en cours"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build -- ${{ inputs.all_seasons && '--all' || '' }}
      - name: Commit des données mises à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Mise à jour du classement"
            git push
          fi
